# Shared, content-addressed expand store. One Redis fronts all proxy replicas;
# because refs are content hashes, any replica can resolve any expansion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tooltrim-redis
  namespace: tooltrim
  labels: { app: tooltrim-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: tooltrim-redis } }
  template:
    metadata:
      labels: { app: tooltrim-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "640Mi" }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tooltrim-redis
  namespace: tooltrim
spec:
  selector: { app: tooltrim-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
